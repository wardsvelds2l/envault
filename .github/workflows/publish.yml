name: publish

on:
  release:
    types: [published]

# This job runs once a release is published. The matching release PR is
# produced by the release-please workflow; merging it creates the GitHub
# release, which in turn triggers this job to push the package to npm.
#
# Required secrets (configure under Settings -> Secrets):
#   NPM_TOKEN    - an automation token with publish rights for the
#                  `envault` package. Generate at https://www.npmjs.com/settings/<user>/tokens
#                  (use "Automation" token type). Expose to "All repositories"
#                  or specifically to this repo.

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run all

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
