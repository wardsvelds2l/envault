name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same PR / branch when a new commit
# is pushed. Saves CI minutes and avoids stale results.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint / Typecheck / Test / Bundle (${{ matrix.node-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Bundle
        run: npm run bundle

      - name: Upload bundle (Linux)
        if: runner.os == 'Linux' && matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: envault-bundle-${{ matrix.node-version }}
          path: dist/envault.js
          if-no-files-found: error

  coverage:
    name: Coverage (Node 22 / Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Test with coverage
        run: npm run test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  smoke:
    name: Smoke (bundled CLI)
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run bundle
      - name: Verify bundled CLI runs on ${{ matrix.os }}
        shell: bash
        run: |
          node dist/envault.js --version
          node dist/envault.js --help
          node dist/envault.js init --help
          node dist/envault.js add --help
          node dist/envault.js set --help
          node dist/envault.js lock --help
          node dist/envault.js unlock --help
          node dist/envault.js get --help
          node dist/envault.js run --help
          node dist/envault.js rotate --help
          node dist/envault.js inspect --help
